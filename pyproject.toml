[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "review-pulse"
version = "0.1.0"
description = "ReviewPulse: weekly insights from Groww app reviews, published to Google Docs and Gmail via MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "langdetect>=1.0.9",
    # Play Store public listing (§13 #2). Pinned: its request format and parser are used
    # directly (see ingest/play_public.py), and those internals can change in any release.
    "google-play-scraper>=1.2.7,<1.3",
    # Default analysis engine (architecture §4.4): local, free, deterministic.
    "scikit-learn>=1.5,<2",
    "model2vec>=0.10,<0.11",
    "huggingface-hub>=0.24",
]

[project.urls]
Homepage = "https://github.com/tejasgs-dev/review-pulse-agent"
Repository = "https://github.com/tejasgs-dev/review-pulse-agent"
Issues = "https://github.com/tejasgs-dev/review-pulse-agent/issues"

[project.optional-dependencies]
# Optional paid engine: `pulse run --engine llm` (Claude API, needs ANTHROPIC_API_KEY).
llm = ["anthropic>=0.70"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
pulse = "pulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the network: the real Claude API (costs money) or the real embedding model; run with -m slow"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
