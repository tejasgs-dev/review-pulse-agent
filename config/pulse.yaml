# Non-secret settings (architecture §8). Secrets and per-user values come from
# environment variables or .env; ${VAR} references are expanded at load time.

product:
  name: Groww
  play_package: com.nextbillion.groww
  app_store_id: "1404871703"        # verified 2026-11-21 via the iTunes Search API (§13 #3)
  app_store_country: in

window:
  weeks_back: 10                    # 8–12
  timezone: Asia/Kolkata

paths:
  data_dir: data                    # relative to the project root; git-ignored
  runs_dir: runs

ingest:
  request_delay_seconds: 1.5        # polite throttling between feed requests
  max_retries: 3                    # per feed page, with exponential backoff
  user_agent: "review-pulse/0.1 (+public review analysis)"
  app_store_max_pages: 10
  overlap_days: 3                   # incremental runs re-fetch this many days to catch edits
  # Cleaning rules (normalize.py), in order: strip emojis, drop reviews with no text left,
  # drop reviews under min_words words, drop anything that is not English.
  min_words: 9                      # "more than 8 words"; counted after emojis are removed
  # Play Store public listing via google-play-scraper: no login, rate-limited (the delay
  # above applies between requests). Approved for this course project, see §13 #2.
  # Set enabled: false to fall back to export files in data/imports/play/.
  play_public:
    enabled: true
    langs: [en]                     # hl= filters reviews by language; only English is kept
    country: in
    batch_size: 200                 # reviews per request
    max_reviews: 40000              # hard stop per run, so a backfill stays bounded
  max_malformed_ratio: 0.10         # a Play export file with more bad rows than this is skipped
  # Logical field -> column name in the export (§13 #2). Only these fields can be
  # mapped, so identity columns (author, device, reviewer language) are never read.
  # Required: rating, text, date. Timestamps without a time zone are read as UTC.
  play_columns:
    review_id: "Review Link"
    rating: "Star Rating"
    title: "Review Title"
    text: "Review Text"
    date: "Review Submit Date and Time"
    updated: "Review Last Update Date and Time"
    app_version: "App Version Name"

privacy:
  number_min_digits: 8              # digit runs this long become [number] (Groww ticket numbers are 8)
  reference_min_digits: 5           # shorter numbers right after "ticket", "order", "UTR", ... too
                                    # amounts after ₹ / Rs / INR are never redacted

analysis:
  # local (default): sentence embeddings + k-means, rules and templates; free, offline after
  # the first model download, deterministic. llm: the Claude API (optional `[llm]` extra,
  # needs ANTHROPIC_API_KEY, costs money). `--engine` on the CLI overrides this.
  engine: local
  theme_catalogue: config/themes.yaml   # labels, keywords and templates (§4.4, §4.5)
  local:
    model: minishlab/potion-base-8M     # model2vec static embeddings, about 30 MB
    model_revision: bf8b056651a2c21b8d2565580b8569da283cab23   # pinned; cached in data/models/
    micro_clusters: 12                  # k-means over-clustering before routing
    micro_clusters_retry: 16            # used once if `other` is above max_other_share
    n_init: 50
    seed: 42
    min_stability: 0.75                 # median ARI vs seeds 43–45; picks the number of themes
    other_cosine: 0.40                  # a review this far from its theme goes to `other`
    secondary_margin: 0.05              # second-nearest theme within this -> secondary theme
    loose_cohesion: 0.55                # a micro-cluster looser than this goes to `other`
    # General praise: 4–5★, a praise word, and none of the specific words.
    praise_words: [good, great, best, nice, excellent, awesome, amazing, love, superb, easy,
                   smooth, helpful, wonderful, fantastic, perfect, user friendly, simple]
    specific_words: [but, however, please, pls, plz, kindly, issue, problem, bug, fix, add,
                     not, "no", never, slow, lag, crash, hang, charge, charges, fee, brokerage,
                     support, withdraw, withdrawal, kyc, refund, loss, fraud, scam, update,
                     should, need, want, why, worst, bad, poor, improve, feature, option]
    # Micro-clusters whose top keywords are mostly these become `other` (venting, Hinglish).
    vague_words: [worst, bad, useless, experience, poor, waste, install, uninstall, rating,
                  star, thank, thanks, lost, fraud, hai, bhi, ho, rha, ke, par, hindi, nahi,
                  kya, mai, hain, se, ka, ki]
    # A review that mentions any of these is never quoted: the subject belongs to no theme,
    # so the quote would be off-topic even when the review shares a keyword with the theme.
    quote_off_topic_words: [spam, spammed, spamming, privacy, contact details, contact number,
                            phone number, personal data, personal details, personal information,
                            data leak, leaked, leaking, selling data, sold my data, hacked,
                            hacker, telemarketing, marketing calls, promotional calls,
                            unwanted calls, cold calls]
    # Capitalized words that are never taken for a person's name in quotes (PII-11).
    name_allowlist: [Groww, UPI, IPO, IPOs, SIP, SIPs, NSE, BSE, Nifty, Sensex, Bank, India,
                     Indian, Android, iPhone, iPad, iOS, Google, Play, Store, App, Apple,
                     Zerodha, Upstox, Angel, Paytm, PhonePe, GPay, Aadhaar, Aadhar, PAN, KYC,
                     NAV, ETF, ETFs, MTF, GTT, F&O, FnO, OTP, TradingView, Hindi, English,
                     January, February, March, April, May, June, July, August, September,
                     October, November, December, Monday, Tuesday, Wednesday, Thursday,
                     Friday, Saturday, Sunday, Diwali, Rs, INR, US, USA, AI]
  max_themes: 5
  top_themes: 3
  quotes: 3
  actions: 3
  max_words: 250
  min_reviews: 50
  quote_min_words: 8
  quote_max_words: 60
  seed_themes: [onboarding_kyc, payments, withdrawals, performance_bugs,
                charges, support, trading_features, statements_tax]
  # Theme clustering (§4.4). Pass A reads every review up to max_discovery_reviews,
  # then a stratified sample; Pass B assigns in batches run assign_concurrency at a time.
  max_discovery_reviews: 3000
  assign_batch_size: 500
  assign_concurrency: 3
  min_theme_share: 0.03             # smaller themes get a small_theme warning
  max_other_share: 0.25             # above this, Pass A runs once more with `other` examples
  recency_days: 14                  # "recent" window for recency_weight
  consistency_sample: 100           # reviews assigned twice to measure agreement (0 = off)
  min_agreement: 0.85               # below this, the probe records a warning

llm:
  model: claude-opus-5-5
  effort: { cluster: high, assign: medium, compose: high }
  fallbacks: default

publish:
  docs_folder_id: ${PULSE_DOCS_FOLDER_ID}
  recipient: ${PULSE_RECIPIENT}
  doc_title: "Groww Weekly Review Pulse — {iso_week}"

mcp:                                # filled in once §13 #1 is settled
  docs:  { transport: stdio, command: "", args: [] }
  gmail: { transport: stdio, command: "", args: [] }
  tool_map: src/pulse/publish/tool_map.yaml
